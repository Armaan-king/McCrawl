[package]
name = "mccrawl"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
clap = { version = "4.6.8", features = ["derive"] }
# zlib-rs: deflate took 66% of the crawl's CPU with the default backend (miniz_oxide).
# The feature switches every flate2 user to it, reqwest's gzip decoding included.
flate2 = { version = "1.1.11", features = ["zlib-rs"] }
libc = "0.2.191"
lol_html = "3.0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "zstd", "hickory-dns"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
texting_robots = "0.2.2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
url = "2.5.8"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }

[profile.release]
lto = "fat"
codegen-units = 1
# Line tables only: profiles show function names and lines without a full debug build.
debug = "line-tables-only"
